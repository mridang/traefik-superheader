name: Format Code (Gofmt)

on: push

permissions:
  contents: read

defaults:
  run:
    working-directory: ./

jobs:
  code-formatting:
    runs-on: ubuntu-latest

    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Check Gofmt
        run: |
          unformatted=$(gofmt -s -l .; go run golang.org/x/tools/cmd/goimports@latest -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
